apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq
  namespace: default
  annotations:
    # Never deleted by Argo CD, like postgres.yaml.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  persistence:
    storage: 5Gi
  replicas: 1
  resources:
    limits:
      cpu: '1'
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq
  namespace: default
spec:
  endpoints:
  - interval: 15s
    port: prometheus
    scheme: http
    scrapeTimeout: 14s
  selector:
    matchLabels:
      app.kubernetes.io/component: rabbitmq
