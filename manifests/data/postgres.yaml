apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: default
spec:
  enableSuperuserAccess: true
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  instances: 1
  managed:
    # Database users besides `app` (created by the bootstrap) and `postgres`.
    # Each password comes from a kubernetes.io/basic-auth Secret in `default`
    # (see README, "Secrets"); cnpg.io/reload=true on it applies a new one.
    roles:
    - name: grafana
      ensure: present
      login: true
      # Read-only: can read every table and the monitoring views, change nothing.
      inRoles:
      - pg_read_all_data
      - pg_monitor
      passwordSecret:
        name: grafana-postgres-role
    services:
      additional:
      - selectorType: rw
        serviceTemplate:
          metadata:
            name: postgres
          spec:
            type: ClusterIP
  # It uses ~10m CPU and ~140Mi (128Mi of it shared_buffers) at rest. The
  # CloudNativePG dashboard's utilisation gauges divide usage by these requests,
  # and show "Missing request" without them. No CPU limit: throttling the only
  # database instance would slow every service at once.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  storage:
    size: 1Gi
  superuserSecret:
    name: postgres-superuser
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres
  namespace: default
spec:
  podMetricsEndpoints:
  - interval: 30s
    port: metrics
  selector:
    matchLabels:
      cnpg.io/cluster: postgres
