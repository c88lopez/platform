apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: data
  annotations:
    # Holds data that isn't backed up: Argo CD never deletes it, even when this
    # file is removed. Delete it by hand if that's really the intent.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  enableSuperuserAccess: true
  # Pinned to a version and its digest: `18` (and even `18.6`) is a moving tag,
  # and a new image there would restart the database into a new minor version
  # on the next pull. To upgrade, change both, from the image's registry page.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  instances: 1
  managed:
    # Database users besides `app` (created by the bootstrap) and `postgres`.
    # Each password comes from a kubernetes.io/basic-auth Secret in `data`
    # (see README, "Secrets"); cnpg.io/reload=true on it applies a new one.
    roles:
    - name: grafana
      ensure: present
      login: true
      # Read-only: can read every table and the monitoring views, change nothing.
      inRoles:
      - pg_read_all_data
      - pg_monitor
      passwordSecret:
        name: grafana-postgres-role
    # deny-list's user: owns the deny_list database (below) and nothing else.
    - name: deny_list
      ensure: present
      login: true
      passwordSecret:
        name: deny-list-postgres-role
    services:
      additional:
      - selectorType: rw
        serviceTemplate:
          metadata:
            name: postgres
          spec:
            type: ClusterIP
  # It uses ~10m CPU and ~140Mi (128Mi of it shared_buffers) at rest. The
  # CloudNativePG dashboard's utilisation gauges divide usage by these requests,
  # and show "Missing request" without them. No CPU limit: throttling the only
  # database instance would slow every service at once.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  storage:
    size: 1Gi
  superuserSecret:
    name: postgres-superuser
  # Only read when the cluster is first created: an empty `app` database,
  # owned by the `app` user. (It once imported the old cluster's `app` from
  # `default`, when Postgres moved to `data`; that copy is done.)
  bootstrap:
    initdb:
      database: app
      owner: app
      localeCollate: C
      localeCType: C
---
# deny-list's own database, so it doesn't share importer's `app`. CloudNativePG
# creates it once the deny_list role exists, and keeps it if this resource is
# deleted (databaseReclaimPolicy defaults to retain).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: deny-list
  namespace: data
spec:
  cluster:
    name: postgres
  name: deny_list
  owner: deny_list
---
# PgBouncer in front of `postgres`, so the services' pods share a small, fixed
# number of real connections instead of each pod holding its own. Services
# connect to postgres-pooler-rw.data.svc. Transaction mode: no session state
# (session advisory locks, LISTEN/NOTIFY, SET outside a transaction, temp
# tables), so migrations and Grafana stay on the direct `postgres-rw`/`postgres`.
#
# Budget: up to default_pool_size real connections per database/user pair, and
# max_db_connections per database across its users, out of max_connections 100.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: postgres-pooler-rw
  namespace: data
spec:
  cluster:
    name: postgres
  instances: 1
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "20"
      max_db_connections: "30"
      # Tracks protocol-level prepared statements per server connection, so
      # pgx's default statement cache works in transaction mode.
      max_prepared_statements: "200"
  template:
    spec:
      containers:
      - name: pgbouncer
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres
  namespace: data
spec:
  podMetricsEndpoints:
  - interval: 30s
    port: metrics
  selector:
    matchLabels:
      cnpg.io/cluster: postgres
    # The Pooler's pods have their own monitor (below).
    matchExpressions:
    - key: cnpg.io/poolerName
      operator: DoesNotExist
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres-pooler-rw
  namespace: data
spec:
  podMetricsEndpoints:
  - interval: 30s
    port: metrics
  selector:
    matchLabels:
      cnpg.io/poolerName: postgres-pooler-rw
