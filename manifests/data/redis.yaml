apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: data
  annotations:
    # Never deleted by Argo CD, like postgres.yaml.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  serviceName: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - args:
        - "--requirepass"
        - "$(REDIS_PASSWORD)"
        - "--appendonly"
        - 'yes'
        - "--maxmemory"
        - 200mb
        - "--maxmemory-policy"
        - allkeys-lru
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: redis-secret
        image: redis:8-alpine
        livenessProbe:
          initialDelaySeconds: 15
          periodSeconds: 20
          tcpSocket:
            port: redis
        name: redis
        ports:
        - containerPort: 6379
          name: redis
        readinessProbe:
          exec:
            command:
            - sh
            - "-c"
            - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
          periodSeconds: 10
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: "/data"
          name: data
      - env:
        - name: REDIS_ADDR
          value: redis://localhost:6379
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: redis-secret
        image: oliver006/redis_exporter:v1.67.0
        name: exporter
        ports:
        - containerPort: 9121
          name: metrics
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      storageClassName: hostpath
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: redis
  name: redis
  namespace: data
spec:
  ports:
  - name: redis
    port: 6379
    targetPort: redis
  selector:
    app: redis
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: redis
  namespace: data
spec:
  podMetricsEndpoints:
  - interval: 30s
    port: metrics
  selector:
    matchLabels:
      app: redis
