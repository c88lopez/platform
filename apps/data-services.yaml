# Postgres, RabbitMQ and Redis, in the `data` namespace. Needs their Secrets
# (README).
#
# Not named `data`: that Application deployed them to `default`. Removing it
# (no resources-finalizer) left those running and unmanaged, instead of
# pruning them, so the new Postgres could copy the old one's data.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  source:
    repoURL: https://github.com/c88lopez/platform.git
    targetRevision: main
    path: manifests/data
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
