# Prometheus, its operator, kube-state-metrics, node-exporter. Wave 1: its CRDs
# (ServiceMonitor, PodMonitor) must exist before anything that has a monitor.
# Chart kube-prometheus-stack 92.16.0, release "kube-prometheus-stack", values in helm/kube-prometheus-stack.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.16.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/helm/kube-prometheus-stack.yaml
    - repoURL: https://github.com/c88lopez/platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
