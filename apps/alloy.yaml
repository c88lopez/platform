# Alloy: ships pod logs to Loki, forwards OTLP traces to Tempo.
# Chart alloy 1.14.4, release "alloy", values in helm/alloy.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.14.4
      helm:
        releaseName: alloy
        valueFiles:
          - $values/helm/alloy.yaml
    - repoURL: https://github.com/c88lopez/platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
