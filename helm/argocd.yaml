# Argo CD: deploys everything in this repo (apps/) and the apps (importer)
# from Git, including itself (apps/argocd.yaml). `make bootstrap` renders this
# file for the first install.

configs:
  cm:
    # Links in the UI and CLI point here (the chart's default is argocd.example.com).
    url: http://192.168.68.57:30081
    # Argo CD doesn't report an Application's health on its parent by default,
    # so the root Application's sync waves wouldn't wait for one wave's apps to
    # be Healthy before starting the next (e.g. the operators before the data
    # services they create). This is the check from Argo CD's docs.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
  params:
    # Serve plain HTTP: the UI is only reachable on the LAN, through the NodePort below.
    server.insecure: true
    # Compare Git with the cluster through a server-side apply dry run: fields
    # set by other controllers (webhook caBundles injected by cert-manager,
    # KEDA and CloudNativePG, defaults from admission webhooks) then don't
    # show as differences.
    controller.diff.server.side: true
    # How long the controller waits for the repo server to render an app
    # (default 60s). On the first sync, right after the repo server restarted
    # with an empty cache, all the apps asked for their charts at once and
    # keda, metrics-server and loki timed out.
    controller.repo.server.timeout.seconds: 180

server:
  service:
    type: NodePort
    nodePortHttp: 30081 # the importer API has 30080
    nodePortHttps: 30444
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Not used: no SSO (log in as admin), no notifications, no ApplicationSets.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0 # the chart has no enabled flag for it
