# KEDA (kedacore/keda 2.21.0). Scales Deployments on event sources, like the
# length of a RabbitMQ queue: a ScaledObject creates and drives an HPA for its
# Deployment. importer-worker scales this way (importer's k8s/worker/).
#
#   make keda
#
# It serves the external.metrics.k8s.io API, which only one thing in a cluster
# can serve: don't also install prometheus-adapter's external metrics.
#
# The chart's defaults are what's wanted; this file is here so the release has
# the same shape as the others.
